specVersion: "3.0"
metadata:
  name: sd.sales.cockpit.deploy
type: application
builder:
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://YOUR-ABAP-SYSTEM.example.com
          client: "100"
        credentials:
          username: env:ABAP_USERNAME
          password: env:ABAP_PASSWORD
        app:
          name: ZSD_COCKPIT
          description: SD Sales Cockpit
          package: ZSAP_SD_COCKPIT_FR2
          transport: $TMP
